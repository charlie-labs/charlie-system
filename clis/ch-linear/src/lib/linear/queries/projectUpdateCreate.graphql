mutation ProjectUpdateCreate($input: ProjectUpdateCreateInput!) {
  projectUpdateCreate(input: $input) {
    success
    lastSyncId
    projectUpdate {
      id
      createdAt
      updatedAt
      body
      url
      health
      user {
        ...UserLite
      }
      project {
        id
        name
        slugId
      }
      diffMarkdown
    }
  }
}
