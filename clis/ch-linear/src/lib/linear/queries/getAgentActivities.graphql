query GetAgentActivities(
  $filter: AgentActivityFilter
  $first: Int
  $after: String
) {
  agentActivities(filter: $filter, first: $first, after: $after) {
    nodes {
      id
      createdAt
      updatedAt
      ephemeral
      signal
      signalMetadata
      contextualMetadata
      content {
        __typename
        ... on AgentActivityThoughtContent {
          type
          body
        }
        ... on AgentActivityActionContent {
          type
          action
          parameter
          result
        }
        ... on AgentActivityResponseContent {
          type
          body
        }
        ... on AgentActivityPromptContent {
          type
          body
        }
        ... on AgentActivityErrorContent {
          type
          body
        }
        ... on AgentActivityElicitationContent {
          type
          body
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
