mutation AgentSessionCreate($input: AgentSessionCreateInput!) {
  agentSessionCreate(input: $input) {
    success
    lastSyncId
    agentSession {
      id
      createdAt
      updatedAt
      status
      type
      issue {
        id
        identifier
      }
      comment {
        id
      }
      externalUrls
      summary
      plan
    }
  }
}
