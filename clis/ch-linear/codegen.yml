# GraphQL Code Generator configuration
overwrite: true
schema: https://api.linear.app/graphql
documents: 'src/lib/linear/queries/*.graphql'
# Generate output TypeScript SDK with typed GraphQL -Request helpers.
generates:
  ./src/generated/linear-sdk.ts:
    plugins:
      - add:
          content: |
            /* !IMPORTANT! This file was automatically generated and SHOULD NOT BE EDITED MANUALLY! */
            /* NO HUMAN OR LLM SHOULD BE EDITING THIS FILE! */
            /* Use `bun run codegen` to regenerate this file. DO NOT EDIT THIS FILE DIRECTLY! EVER! */
      - typescript
      - typescript-operations # generates typed variables/results for operations
      - typescript-graphql-request # adds `getSdk` factory for GraphQL-Request
    config:
      documentMode: documentNode # output DocumentNode objects instead of gql strings
      typedDocumentNode: true # add strong typing for DocumentNode objects
      # Include only operation -related types to keep the generated file lightweight.
      onlyOperationTypes: true
